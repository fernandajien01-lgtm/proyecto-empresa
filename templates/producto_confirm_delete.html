{% extends 'base.html' %}

{% block title %}Eliminar producto{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 text-center">
                <h3 class="mb-3">¿Estás seguro que deseas eliminar el producto "{{ producto.nombre }}"?</h3>
                <p class="text-muted">Esta acción es irreversible.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2 mt-4">
                        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-danger">Sí, eliminar producto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
