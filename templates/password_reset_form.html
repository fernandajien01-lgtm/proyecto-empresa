{% extends 'base.html' %}

{% block title %}Recuperar contraseña{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h2 class="mb-3 text-center">Recuperar contraseña</h2>
                <p class="text-muted">Escribe el correo asociado a tu cuenta. Te enviaremos un enlace para crear una contraseña nueva.</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary-custom w-100">Enviar enlace</button>
                </form>
                <div class="mt-3 text-center">
                    <a href="{% url 'login' %}">Volver a iniciar sesión</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
