{% extends 'base.html' %}

{% block title %}Correo enviado{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 text-center">
                <h2 class="mb-3">Revisa tu correo</h2>
                <p class="text-muted">Si existe una cuenta con ese correo, recibirás un enlace para cambiar tu contraseña. Revisa también la carpeta de spam.</p>
                <a href="{% url 'login' %}" class="btn btn-primary-custom">Volver a iniciar sesión</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
