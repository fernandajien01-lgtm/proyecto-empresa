{% extends 'base.html' %}

{% block title %}Iniciar sesión{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h2 class="mb-3 text-center">Iniciar sesión</h2>
                <p class="text-muted text-center">Accede como Empresa, Empleado o Cliente.</p>
                <form method="post" autocomplete="off">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary-custom w-100">Entrar</button>
                </form>
                <div class="mt-3 text-center">
                    <a href="{% url 'password_reset' %}">¿Olvidaste tu contraseña?</a>
                </div>
                <div class="mt-3 text-center">
                    <a href="{% url 'register' %}">¿No tienes cuenta? Regístrate</a>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    function limpiarCamposLogin() {
        const username = document.getElementById("id_username");
        const password = document.getElementById("id_password");
        if (username) username.value = "";
        if (password) password.value = "";
    }
    document.addEventListener("DOMContentLoaded", limpiarCamposLogin);
    window.addEventListener("load", limpiarCamposLogin);
    window.setTimeout(limpiarCamposLogin, 500);
</script>
{% endblock %}
